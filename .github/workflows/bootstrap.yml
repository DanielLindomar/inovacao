name: Bootstrap do conteudo
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Extrair o pacote do site
        run: |
          tar xzf site-completo.tar.gz --exclude=.github/workflows
          rm site-completo.tar.gz

      - name: Commit do conteudo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Conteudo completo do site, extraido do pacote"
          git push
